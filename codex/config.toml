# workflow-kit — [P] portable Codex lane config, installed verbatim to <repo>/.codex/config.toml.
#
# WHY THIS EXISTS: a pager that waits for a keypress hangs a non-interactive agent run. `git log` /
# `git diff` invoke $GIT_PAGER, and the default pager blocks when nothing is attached to read it.
# Pinning it to `cat` removes that DEFAULT as a hang risk. It is not a guarantee: nothing here
# verifies Codex loaded this file, and a command may still set its own GIT_PAGER.
#
# `inherit = "core"` keeps the shell environment minimal-but-usable rather than passing the operator's
# whole environment to model-generated commands.
#
# DELIBERATELY NO `hooks` KEY HERE, and that is not an oversight. Codex accepts hook registrations in
# EITHER this file or <repo>/.codex/hooks.json, and warns when both carry them ("prefer a single
# representation for this layer"). The kit's registration lives in <repo>/.codex/hooks.json, which
# `init` GENERATES (it bakes this checkout's absolute path into every hook command, so it is
# per-checkout and gitignored). Installing this file buys you NO enforcement by itself, and neither
# does that registration until a human grants hook trust in an INTERACTIVE codex session — an
# untrusted hook is skipped silently. `node scripts/check-codex-hooks-armed.mjs` is what tells you
# whether the guards are live; the kit's PORTABILITY.md § The enforcement asymmetry (workflow-kit
# repository) has the executed reasons. If you declare your own hooks in this file, a plain `init`
# keeps this file and writes NO hooks.json — one representation, yours, and the kit's guards are
# then registered only if you carry them (init says so at the site). A `--force` run REPLACES this
# file with the kit's copy, backing yours up to config.toml.bak, and writes the registration.

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
GIT_PAGER = "cat"
